name: Publish Package

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:

  publish:
    runs-on: ubuntu-latest 
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Installing uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
    
    - name: Install build dependencies  # ADD THIS STEP
      run: uv sync --all-extras       

    - name: Build HTML
      run: | 
        cd docs/
        make html
    
    - name: Run ghp-import
      run: | 
        ghp-import -n -p -f docs/_build/html
